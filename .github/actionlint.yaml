# actionlint configuration (https://github.com/rhysd/actionlint/blob/main/docs/config.md).
#
# actionlint 1.7.12 does not know the self-repository form "$/<path>" of
# `uses:` (GitHub changelog 2026-07-30; rhysd/actionlint issues 711 and 732).
# Each reusable component workflow calls its composite action that way, so
# that a fork runs its own copy. The ignore below matches only that message,
# only for the named component, only in its own workflow file. Remove it when
# actionlint supports the form. While it is here, actionlint skips the with:
# keys of that step; check-genericity.sh checks them instead.
paths:
  .github/workflows/cloudflare-workers-deploy.yml:
    ignore:
      - 'specifying action "\$/cloudflare-workers-deploy" in invalid format because ref is missing'
