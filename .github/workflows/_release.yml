# Internal release workflow of this repository (release-please). It opens and
# updates the release pull request and, when that pull request is merged,
# creates the tag <component>-vX.Y.Z and the release of each component in it,
# then moves the major tag <component>-vN of each component released outside
# pre-release. A repository ruleset lets only the release App create, move or
# delete those tags, so this job mints a short-lived App token narrowed to
# this repository and to the two permissions release-please needs; the same
# token moves the major tags.
#
# The App credentials are organization-level names of the maintainer
# organization; in a fork without them the job is skipped by the owner guard.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: ${{ github.repository == 'middag-io/actions' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # release-please-config.json lists one package per component. Before
      # the first component it lists none, and the job stops here. The
      # checkout also holds the major tag script.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Count the release packages
        id: packages
        run: |
          count="$(jq '.packages | length' release-please-config.json)"
          echo "release packages: $count"
          echo "count=$count" >>"$GITHUB_OUTPUT"

      - name: Mint a release App token
        if: ${{ steps.packages.outputs.count != '0' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APPS_MIDDAG_CI_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APPS_MIDDAG_CI_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: actions
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        if: ${{ steps.packages.outputs.count != '0' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Move the major tag of each released component
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: bash .github/scripts/move-major-tags.sh
