# Internal CI of this repository. Every job feeds ci-gate, the aggregated
# required check. To add a job, list it in the `needs:` of ci-gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Calls the reusable workflow by a relative path, as a caller would by
  # SHA, on a fixture plugin tree. A dry run: no credentials, no dependency
  # install, no artifact and no release upload.
  # zizmor self-repository: "./" is the documented form of this test job; in
  # a job of this repository it resolves to the same commit as "$/".
  dry-run-moodle-plugin-package:
    name: dry-run-moodle-plugin-package
    permissions:
      contents: read
    uses: ./.github/workflows/moodle-plugin-package.yml # zizmor: ignore[self-repository]
    with:
      zip-name: local_example
      path: moodle-plugin-package/tests/fixtures/basic
      dry-run: true

  # The dry run must package exactly the files of the reference listing
  # (tests/fixtures/expected/basic.sha256) and read version.php.
  dry-run-check-moodle-plugin-package:
    name: dry-run-check-moodle-plugin-package
    needs: dry-run-moodle-plugin-package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the dry-run outputs with the expected listing
        env:
          VERSION: ${{ needs.dry-run-moodle-plugin-package.outputs.version }}
          RELEASE: ${{ needs.dry-run-moodle-plugin-package.outputs.release }}
          FILES: ${{ needs.dry-run-moodle-plugin-package.outputs.files }}
          LISTING_SHA256: ${{ needs.dry-run-moodle-plugin-package.outputs.listing-sha256 }}
        run: |
          expected="moodle-plugin-package/tests/fixtures/expected/basic.sha256"
          expected_sha="$(sha256sum "$expected" | cut -d' ' -f1)"
          expected_files="$(grep -c . "$expected")"
          echo "version=$VERSION release=$RELEASE files=$FILES listing-sha256=$LISTING_SHA256"
          if [ "$VERSION" != "2026110300" ] || [ "$RELEASE" != "1.2.0" ] || [ "$FILES" != "$expected_files" ] || [ "$LISTING_SHA256" != "$expected_sha" ]; then
            echo "::error::dry-run outputs differ: expected version=2026110300 release=1.2.0 files=$expected_files listing-sha256=$expected_sha"
            exit 1
          fi

  ci-gate:
    name: ci-gate
    needs:
      - dry-run-moodle-plugin-package
      - dry-run-check-moodle-plugin-package
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON")"
          if [ -n "$failed" ]; then
            printf '::error::Required jobs did not succeed:\n%s\n' "$failed"
            exit 1
          fi
          jq -r 'keys[] | "\(.): success"' <<<"$NEEDS_JSON"
