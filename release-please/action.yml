# Composite action: runs release-please in manifest mode with a GitHub App
# installation token, after checking the configuration and the manifest of
# the calling repository. See README.md next to this file for the inputs and
# what release-please writes.
name: Release Please
description: >-
  Checks the release-please configuration and manifest of the repository,
  then runs googleapis/release-please-action with a GitHub App installation
  token: it opens or updates the release pull request, and creates the tag
  and the GitHub release when that pull request merges.

inputs:
  config-file:
    description: Path of the release-please configuration, relative to the repository root. The file must be checked out in the workspace.
    required: false
    default: release-please-config.json
  manifest-file:
    description: Path of the release-please manifest, relative to the repository root. The file must be checked out in the workspace.
    required: false
    default: .release-please-manifest.json
  target-branch:
    description: Branch that the release pull request targets. Empty uses the default branch of the repository.
    required: false
    default: ""
  app-client-id:
    description: Client id of the GitHub App whose installation token runs release-please. Required unless dry-run is true.
    required: false
    default: ""
  app-private-key:
    description: Private key of the GitHub App, passed from a secret. Required unless dry-run is true.
    required: false
    default: ""
  dedup-merge-commits:
    description: >-
      Drop the merge-commit duplicates that release-please writes into the release notes: after release-please opens or
      updates the release pull request, remove from its CHANGELOG.md files and its body each merge-commit entry whose
      subject another, ordinary commit entry repeats (true or false). A change to a CHANGELOG.md is pushed to the release
      branch as one commit.
    required: false
    default: "true"
  dry-run:
    description: Check the inputs, the configuration and the manifest only; no token, no network, no writes (true or false).
    required: false
    default: "false"

outputs:
  release-created:
    description: true when this run created a release of the root package ("."), false otherwise (always false in a dry run).
    value: ${{ steps.release.outputs.release_created || 'false' }}
  tag-name:
    description: Tag of the release of the root package created by this run; empty when none.
    value: ${{ steps.release.outputs.tag_name }}
  version:
    description: Version of the release of the root package created by this run; empty when none.
    value: ${{ steps.release.outputs.version }}
  packages:
    description: Package paths of the configuration, as a sorted JSON array (for example ["."]).
    value: ${{ steps.check.outputs.packages }}
  paths-released:
    description: Paths of the packages released by this run, as a JSON array (for example ["packages/cli"]); [] when none (always [] in a dry run).
    value: ${{ steps.release.outputs.paths_released || '[]' }}
  releases:
    description: >-
      Releases created by this run, as a JSON array of {"path", "tag-name", "version"} objects, root package (".")
      included; [] when none (always [] in a dry run).
    value: ${{ steps.outputs.outputs.releases || '[]' }}
  release-pr-created:
    description: true when this run created or updated a release pull request, false otherwise (always false in a dry run).
    value: ${{ steps.outputs.outputs.release-pr-created || 'false' }}
  release-pr-branch:
    description: Head branch of the release pull request created or updated by this run; empty when none.
    value: ${{ steps.outputs.outputs.release-pr-branch }}
  release-pr-number:
    description: Number of the release pull request created or updated by this run; empty when none.
    value: ${{ steps.outputs.outputs.release-pr-number }}
  release-prs:
    description: >-
      Release pull requests created or updated by this run, as a JSON array of {"branch", "number"} objects (several
      with separate-pull-requests); [] when none (always [] in a dry run).
    value: ${{ steps.outputs.outputs.release-prs || '[]' }}

runs:
  using: composite
  steps:
    - name: Check the inputs, the configuration and the manifest
      id: check
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        MANIFEST_FILE: ${{ inputs.manifest-file }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        DEDUP_MERGE_COMMITS: ${{ inputs.dedup-merge-commits }}
        DRY_RUN: ${{ inputs.dry-run }}
        HAS_APP_CLIENT_ID: ${{ inputs.app-client-id != '' }}
        HAS_APP_PRIVATE_KEY: ${{ inputs.app-private-key != '' }}
      run: |
        python3 -I "$GITHUB_ACTION_PATH/scripts/check_config.py" \
          --config-file="$CONFIG_FILE" \
          --manifest-file="$MANIFEST_FILE" \
          --target-branch="$TARGET_BRANCH" \
          --dedup-merge-commits="$DEDUP_MERGE_COMMITS" \
          --dry-run="$DRY_RUN" \
          --has-app-client-id="$HAS_APP_CLIENT_ID" \
          --has-app-private-key="$HAS_APP_PRIVATE_KEY"

    # Without owner and repositories, the token is limited to the current
    # repository, with write access to contents and pull requests only. A
    # pull request opened with it triggers the workflows of the repository;
    # one opened with GITHUB_TOKEN would not.
    - name: Create the GitHub App token
      id: app-token
      if: ${{ inputs.dry-run != 'true' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Run release-please
      id: release
      if: ${{ inputs.dry-run != 'true' }}
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
        target-branch: ${{ inputs.target-branch }}

    # release-please-action names the outputs of a package that is not the
    # root after its path, which a composite action cannot pass through. The
    # script turns every output of the release step into the fixed-name
    # outputs releases and release-pr-*.
    - name: Report the releases and the release pull requests
      id: outputs
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
      run: python3 -I "$GITHUB_ACTION_PATH/scripts/release_outputs.py"

    # release-please-action sets prs_created and prs only when it created or
    # updated a release pull request in this run. The script reads the
    # CHANGELOG.md files from the release branch, so it clones that branch
    # itself and leaves the caller's workspace alone.
    - name: Drop merge-commit duplicates from the release notes
      id: dedup
      if: ${{ inputs.dry-run != 'true' && inputs.dedup-merge-commits == 'true' && steps.release.outputs.prs_created == 'true' }}
      shell: bash
      env:
        PRS_JSON: ${{ steps.release.outputs.prs }}
        CONFIG_FILE: ${{ inputs.config-file }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/dedup-release-pr.sh"
