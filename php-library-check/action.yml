# Composite action: checks a PHP library (a Composer package) in a change, on
# one PHP version. PHP, Composer and the install come from the
# php-composer-setup action of this repository, and the dependency audit from
# its php-composer-scan action. See README.md next to this file for the
# inputs, what the action deletes (nothing; it can rewrite composer.json in
# the checkout) and the permissions it needs.
name: PHP library check
description: >-
  Installs a Composer package on one PHP version (the locked or the highest
  dependency versions), audits its dependencies, checks the major version of
  named packages, and runs composer validate, the PSR-4 autoload check, the
  lint, PHPStan, PHP-CS-Fixer and Rector scripts (static checks) and the
  test script that the caller names. Publishes nothing.

inputs:
  path:
    description: Directory of the library (the one that holds composer.json), relative to the checkout.
    required: false
    default: "."
  php-version:
    description: PHP version to set up (for example 8.3).
    required: true
  php-extensions:
    description: PHP extensions to install, separated by commas.
    required: false
    default: "mbstring, xml, curl, intl"
  static-checks:
    description: Run the static checks in this job (true or false); the test script runs either way.
    required: false
    default: "true"
  composer-validate:
    description: Run composer validate --no-check-publish --no-check-lock as a static check (true or false).
    required: false
    default: "true"
  composer-validate-strict:
    description: Add --strict to composer validate, so that warnings fail (true or false).
    required: false
    default: "false"
  strict-psr:
    description: Run composer dump-autoload --optimize --strict-psr as a static check, which fails on a class outside its PSR-4 path (true or false).
    required: false
    default: "true"
  lint-script:
    description: Composer script of the PHP syntax lint, a static check. Empty skips it.
    required: false
    default: ""
  phpstan-script:
    description: Composer script that runs PHPStan, a static check. Empty skips it.
    required: false
    default: check:stan
  cs-fixer-script:
    description: Composer script that runs PHP-CS-Fixer without fixing, a static check. Empty skips it.
    required: false
    default: check:style
  rector-script:
    description: Composer script that runs Rector in dry-run mode, a static check. Empty skips it.
    required: false
    default: check:rector
  composer-scripts:
    description: More Composer scripts to run after the static checks, in order, separated by commas or new lines; static checks too.
    required: false
    default: ""
  test-script:
    description: Composer script that runs the tests (PHPUnit), in every job. Empty skips it.
    required: false
    default: test
  dependency-versions:
    description: >-
      locked installs with composer install (from composer.lock when there is
      one); highest runs composer update, for the highest versions that the
      constraints and the PHP version allow.
    required: false
    default: locked
  unset-platform-php:
    description: >-
      Remove config.platform.php from composer.json in the checkout before
      the install, so that the PHP version of the job, not the pinned one,
      constrains the resolution (true or false).
    required: false
    default: "false"
  expect-majors:
    description: >-
      Installed packages and the major version each must have, as
      <vendor>/<package>:<major>, separated by commas or new lines (for
      example symfony/console:8). A package that is missing or at another
      major version fails the job before the checks. Empty checks nothing.
    required: false
    default: ""
  tool-cache-paths:
    description: >-
      Cache directories or files of the static check tools (PHPStan tmpDir,
      Rector cache directory, PHP-CS-Fixer cache file), relative to path,
      separated by commas or new lines (for example .cache). Restored before
      the checks and saved at the end of a successful job with actions/cache,
      only in a job with static-checks true. Empty caches nothing.
    required: false
    default: ""
  audit-blocking-severities:
    description: Severities of a dependency advisory that fail the job, separated by commas (critical, high, medium, low); lower severities are only reported.
    required: false
    default: critical
  composer-auth:
    description: Composer credentials as a JSON object in the COMPOSER_AUTH format, passed from a secret, for private dependencies. Empty means public dependencies only.
    required: false
    default: ""
  dry-run:
    description: Validate the inputs and print the planned commands only; no PHP set-up, no install, no audit, no check (true or false).
    required: false
    default: "false"

outputs:
  commands:
    description: JSON array of the Composer commands planned after the install, in order.
    value: ${{ steps.plan.outputs.commands }}
  audit-command:
    description: The dependency audit command, run or planned.
    value: ${{ steps.audit.outputs.command }}
  install-command:
    description: The composer install or composer update command, run or planned.
    value: ${{ steps.setup.outputs.install-command }}
  platform-command:
    description: The command that removes config.platform.php, run or planned; empty unless unset-platform-php is true.
    value: ${{ steps.setup.outputs.platform-command }}
  expect-majors:
    description: JSON object of the expected major version of each package of expect-majors; {} when empty.
    value: ${{ steps.plan.outputs.expect-majors }}
  tool-cache-paths:
    description: JSON array of the tool cache paths, relative to the checkout, restored and saved or planned; [] when no tool cache.
    value: ${{ steps.plan.outputs.tool-cache-paths }}

runs:
  using: composite
  steps:
    - name: Check the inputs and plan the checks
      id: plan
      shell: bash
      env:
        LIBRARY_PATH: ${{ inputs.path }}
        PHP_VERSION: ${{ inputs.php-version }}
        STATIC_CHECKS: ${{ inputs.static-checks }}
        COMPOSER_VALIDATE: ${{ inputs.composer-validate }}
        COMPOSER_VALIDATE_STRICT: ${{ inputs.composer-validate-strict }}
        STRICT_PSR: ${{ inputs.strict-psr }}
        LINT_SCRIPT: ${{ inputs.lint-script }}
        PHPSTAN_SCRIPT: ${{ inputs.phpstan-script }}
        CS_FIXER_SCRIPT: ${{ inputs.cs-fixer-script }}
        RECTOR_SCRIPT: ${{ inputs.rector-script }}
        COMPOSER_SCRIPTS: ${{ inputs.composer-scripts }}
        TEST_SCRIPT: ${{ inputs.test-script }}
        EXPECT_MAJORS: ${{ inputs.expect-majors }}
        DEPENDENCY_VERSIONS: ${{ inputs.dependency-versions }}
        TOOL_CACHE_PATHS: ${{ inputs.tool-cache-paths }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        plan_file="$(mktemp "$RUNNER_TEMP/php-library-check.XXXXXX")"
        python3 -I "$GITHUB_ACTION_PATH/scripts/check.py" plan \
          --workspace="$GITHUB_WORKSPACE" \
          --path="$LIBRARY_PATH" \
          --php-version="$PHP_VERSION" \
          --static-checks="$STATIC_CHECKS" \
          --composer-validate="$COMPOSER_VALIDATE" \
          --composer-validate-strict="$COMPOSER_VALIDATE_STRICT" \
          --strict-psr="$STRICT_PSR" \
          --lint-script="$LINT_SCRIPT" \
          --phpstan-script="$PHPSTAN_SCRIPT" \
          --cs-fixer-script="$CS_FIXER_SCRIPT" \
          --rector-script="$RECTOR_SCRIPT" \
          --composer-scripts="$COMPOSER_SCRIPTS" \
          --test-script="$TEST_SCRIPT" \
          --expect-majors="$EXPECT_MAJORS" \
          --dependency-versions="$DEPENDENCY_VERSIONS" \
          --tool-cache-paths="$TOOL_CACHE_PATHS" \
          --runner-os="$RUNNER_OS" \
          --commit="$GITHUB_SHA" \
          --dry-run="$DRY_RUN" \
          --plan-file="$plan_file" \
          --github-output="$GITHUB_OUTPUT"

    # php-composer-setup comes from the same repository and commit as this
    # action. It validates its own inputs, sets up PHP and Composer, writes
    # composer-auth to the global Composer auth.json of the runner (outside
    # the checkout), restores the Composer download cache and runs composer
    # install (or composer update, after removing config.platform.php, when
    # asked). In a dry run it only validates and reports, like this action.
    - name: Set up PHP and install the Composer dependencies
      id: setup
      uses: $/php-composer-setup
      with:
        php-version: ${{ inputs.php-version }}
        php-extensions: ${{ inputs.php-extensions }}
        coverage: none
        working-directory: ${{ inputs.path }}
        composer-auth: ${{ inputs.composer-auth }}
        dependency-versions: ${{ inputs.dependency-versions }}
        unset-platform-php: ${{ inputs.unset-platform-php }}
        dry-run: ${{ inputs.dry-run }}

    # php-composer-scan, same repository and commit: composer audit on the
    # installed packages; fails only on audit-blocking-severities. In a dry
    # run it only validates and reports.
    - name: Audit the Composer dependencies
      id: audit
      uses: $/php-composer-scan
      with:
        working-directory: ${{ inputs.path }}
        blocking-severities: ${{ inputs.audit-blocking-severities }}
        dry-run: ${{ inputs.dry-run }}

    # Only with tool-cache-paths, in the job of the static checks. The plan
    # step validated the paths (inside path, not path itself, not vendor) and
    # built the fixed part of the key: runner OS, PHP version,
    # dependency-versions, path and the hash of the Composer and tool
    # configuration files. After the install, this step adds the hash of the
    # installed dependencies (vendor/composer/installed.json) and the commit,
    # so the key follows what Composer resolved, with or without a committed
    # composer.lock. When it cannot read them, it warns and the job runs
    # without the tool cache.
    - name: Build the tool cache key from the installed dependencies
      id: tool-cache
      if: ${{ inputs.dry-run != 'true' && steps.plan.outputs.tool-cache-prefix != '' }}
      shell: bash
      env:
        PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
      run: python3 -I "$GITHUB_ACTION_PATH/scripts/check.py" cache-key --plan-file="$PLAN_FILE" --github-output="$GITHUB_OUTPUT"

    # The restore key falls back to the latest entry with every part of the
    # key but the commit. actions/cache saves at the end of the job, only
    # when it succeeds.
    - name: Restore the caches of the static check tools
      if: ${{ inputs.dry-run != 'true' && steps.tool-cache.outputs.key != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.tool-cache-path-lines }}
        key: ${{ steps.tool-cache.outputs.key }}
        restore-keys: ${{ steps.tool-cache.outputs.restore-keys }}

    - name: Run the library checks
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
      run: python3 -I "$GITHUB_ACTION_PATH/scripts/check.py" run --plan-file="$PLAN_FILE"
